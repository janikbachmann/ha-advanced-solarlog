# Example dashboard for Advanced Solar-Log
#
# Add via: Dashboard → pencil, top right → ⋮ → "Edit in YAML"
#
# The entity IDs below assume the integration has been set up once and the
# device is named "Advanced Solar-Log". If yours differ, the entity picker in
# the UI shows the actual names.

views:
  - title: Solar
    path: solar
    cards:
      # --- Energy flow, built-in card ------------------------------------
      # Shows the flow graphic from the Energy dashboard. Needs the counters
      # from this integration entered under Settings → Dashboards → Energy
      # (production/grid consumption/return to grid today).
      - type: energy-distribution
        link_dashboard: true

      # --- Current values --------------------------------------------------
      - type: glance
        title: Now
        columns: 4
        entities:
          - entity: sensor.advanced_solar_log_production
            name: Production
          - entity: sensor.advanced_solar_log_consumption
            name: Consumption
          - entity: sensor.advanced_solar_log_grid
            name: Grid
          - entity: sensor.advanced_solar_log_battery_power
            name: Battery

      - type: gauge
        entity: sensor.advanced_solar_log_battery_level
        name: Battery
        min: 0
        max: 100
        severity:
          green: 50
          yellow: 20
          red: 0

      # --- Today's totals ----------------------------------------------
      - type: entities
        title: Today
        entities:
          - sensor.advanced_solar_log_yield_today
          - sensor.advanced_solar_log_consumption_today

      # --- History ------------------------------------------------------
      - type: history-graph
        title: History
        hours_to_show: 24
        entities:
          - sensor.advanced_solar_log_production
          - sensor.advanced_solar_log_consumption
          - sensor.advanced_solar_log_grid

      # --- Device state ---------------------------------------------------
      - type: entities
        title: State
        entities:
          - sensor.advanced_solar_log_last_updated
          - sensor.advanced_solar_log_installed_peak_power

# ---------------------------------------------------------------------------
# Alternative: Power Flow Card Plus
#
# Gets closest to the Solar-Log's own live flow display, but is not a
# built-in card -- install it via HACS (Frontend → "Power Flow Card Plus").
# Then use this card:
#
#   type: custom:power-flow-card-plus
#   entities:
#     grid:
#       entity: sensor.advanced_solar_log_grid
#     solar:
#       entity: sensor.advanced_solar_log_production
#     battery:
#       entity: sensor.advanced_solar_log_battery_power
#       state_of_charge: sensor.advanced_solar_log_battery_level
#     home:
#       entity: sensor.advanced_solar_log_consumption
#
# Check the signs: this integration reports grid positive = import and
# negative = feed-in, and battery positive = charging and negative =
# discharging. If the card shows the battery flow backwards, flip it with
# "inverted_animation" or by giving consumption and production separately in
# the card configuration.
