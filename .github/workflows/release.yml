name: Release

# HACS shows a plain commit hash for a repository without releases, so every
# version that lands on main gets a release of its own. The manifest's version
# field is the single source of truth: when it changes, this publishes the
# matching tag. Can also be started by hand to publish a version that landed
# before this workflow existed.
on:
  push:
    branches: [main]
    paths:
      - custom_components/advanced_solarlog/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from the manifest
        id: manifest
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/advanced_solarlog/manifest.json'))['version'])")
          echo "Manifest version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists -- nothing to publish."
            exit 0
          fi
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
